# Render blueprint for Booktunes.
#
# IMPORTANT — what "free" actually covers on Render:
#
#   * Web Services      — free plan available (750 instance-hours/month, spins
#                         down after 15 min idle, ~50s cold start).
#   * Background Workers— NOT available on the free plan. `type: worker`
#                         requires a paid instance type.
#   * Cron Jobs         — also paid-only.
#   * Postgres          — Render's free database is deleted after 30 days.
#   * Key Value (Redis) — free tier exists but is capped and non-persistent.
#
# So this blueprint provisions ONLY the free web service, and points the
# database at Supabase and the cache/broker at Upstash — both of which have
# genuinely non-expiring free tiers.
#
# NOTE ON LOCATION: this file must stay at the REPOSITORY ROOT — Render only
# auto-detects a blueprint named render.yaml there, and a copy under backend/
# is silently ignored. All paths below are repo-root-relative for that reason.
#
# Scheduled work runs via GitHub Actions instead of a Render worker; see
# .github/workflows/scheduled-tasks.yml. That keeps total cost at zero. The
# paid worker/beat services are included below, commented out, for when you
# outgrow that.

services:
  - type: web
    name: booktunes-api
    runtime: docker
    # Paths in a blueprint are resolved from the repo root, not from this
    # file's directory — so both stay prefixed with backend/.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Secrets — set these in the Render dashboard (sync:false keeps them
      # out of the repo). Dashboard -> service -> Environment.
      - key: DATABASE_URL          # Supabase -> Settings -> Database -> URI
        sync: false
      - key: REDIS_URL             # Upstash -> database -> Redis Connect
        sync: false
      # Playlist curation (Deezer + YouTube Music) needs no credentials.
      # Optional — leave unset unless you have a pre-2024-11-27 Spotify app
      # AND Premium on the owning account. See backend/.env.example.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ADMIN_TASK_TOKEN      # guards the /internal task-trigger routes
        sync: false

      - key: SECRET_KEY
        generateValue: true

      # Every origin the browser app is served from. Never "*": the API sets
      # allow_credentials, and browsers reject wildcard + credentials.
      # booktunes-web.onrender.com is the static site defined below.
      - key: CORS_ORIGINS
        value: https://booktunes-web.onrender.com,https://booktunes.vercel.app,http://localhost:5173,http://localhost:3000
      - key: ALLOWED_HOSTS
        value: booktunes-api.onrender.com,localhost,127.0.0.1

      - key: EMBEDDING_CACHE_DIR
        value: /app/.model_cache
      - key: MODEL_STORAGE_DIR
        value: /app/.models

  # --- Frontend -----------------------------------------------------------
  # Static sites are genuinely free on Render (no instance hours, no spin-down)
  # because they are served from the CDN, not a container.
  - type: web
    name: booktunes-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    branch: main
    autoDeploy: true
    envVars:
      # In production the API is on a different host, so there is no dev proxy
      # to lean on — the client calls the absolute URL and the request is a
      # real cross-origin one, covered by CORS_ORIGINS above.
      - key: VITE_API_BASE
        value: https://booktunes-api.onrender.com/api/v1
    routes:
      # Client-side routing: /library and /profile are not files on disk, so
      # every unmatched path has to fall through to index.html or a refresh
      # anywhere but "/" returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        # Asset filenames are content-hashed by Vite, so they can be cached
        # permanently; index.html is not and stays revalidated by default.
        value: public, max-age=31536000, immutable

