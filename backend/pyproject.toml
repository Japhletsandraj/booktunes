[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live Postgres with pgvector (skipped by default)",
    "external: hits a real third-party API (skipped by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"app/models/models.py" = ["F401"]
"tests/*" = ["B011"]

[tool.coverage.run]
omit = ["migrations/*", "tests/*", "scripts/*"]
